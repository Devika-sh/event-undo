<script>
  // Page transition: slide the current page out before following an internal
  // navbar link, so moving between pages reads as one continuous motion
  // instead of a hard cut. Shared verbatim across every page's script.
  (function () {
    var EXIT_MS = 180;
    document.addEventListener('click', function (e) {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var link = e.target.closest('.navbar a[href], .navbar-mobile a[href], .mobile-menu a[href]');
      if (!link) return;
      var href = link.getAttribute('href');
      if (!href || href.charAt(0) === '#' || link.target === '_blank') return;
      e.preventDefault();
      document.body.classList.add('page-exit');
      setTimeout(function () { location.href = href; }, EXIT_MS);
    });
  })();

  // Scroll state: drives the header's scroll-shade gradient. rAF-throttled
  // so it never fights the scroll itself. Shared verbatim across every page.
  (function () {
    var threshold = 80;
    var ticking = false;
    function update() {
      document.body.classList.toggle('is-scrolled', window.scrollY > threshold);
      ticking = false;
    }
    window.addEventListener('scroll', function () {
      if (!ticking) {
        window.requestAnimationFrame(update);
        ticking = true;
      }
    }, { passive: true });
    update();
  })();

  // Filter chips: Default → On Click (selected) → Default. Delegated on the
  // container (not the individual chips) because public-data.js rebuilds the
  // chip row from live org `type` values once Supabase data lands — a plain
  // per-chip listener would go stale the moment that swap happens.
  (function () {
    var bar = document.querySelector('.org-filters');
    var list = document.querySelector('.org-list');
    if (!bar || !list) return;

    function applyFilter() {
      var selected = Array.prototype.slice
        .call(bar.querySelectorAll('.chip--selected'))
        .map(function (c) { return c.dataset.type; });
      var anyVisible = false;
      Array.prototype.forEach.call(list.querySelectorAll('.org-card'), function (card) {
        var show = !selected.length || selected.indexOf(card.dataset.type) !== -1;
        card.hidden = !show;
        if (show) anyVisible = true;
      });
      var empty = list.querySelector('.org-list__empty');
      if (!anyVisible) {
        if (!empty) {
          empty = document.createElement('p');
          empty.className = 'org-list__empty';
          empty.textContent = 'No organisations match that filter yet.';
          list.appendChild(empty);
        }
      } else if (empty) {
        empty.remove();
      }
    }

    bar.addEventListener('click', function (e) {
      var chip = e.target.closest('.chip');
      if (!chip || !bar.contains(chip)) return;
      chip.classList.toggle('chip--selected');
      applyFilter();
    });
  })();

  // Mobile menu toggle: hamburger <-> x-close. Same behaviour as the
  // Discover page's script, scoped to this page's own header/menu.
  (function () {
    var toggle = document.querySelector('.navbar-btn');
    var menu = document.getElementById('org-mobile-menu');
    var head = document.querySelector('.org-head');
    if (!toggle || !menu || !head) return;

    function setOpen(open) {
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      menu.hidden = !open;
      // Elevates the toggle bar above the full-screen menu overlay.
      head.toggleAttribute('data-menu-open', open);
      document.body.style.overflow = open ? 'hidden' : '';
    }

    toggle.addEventListener('click', function () {
      setOpen(toggle.getAttribute('aria-expanded') !== 'true');
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true') setOpen(false);
    });
  })();
</script>
