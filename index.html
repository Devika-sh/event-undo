<script>
  // Filter chips: Default → On Click (selected) → Default
  document.querySelectorAll('.filters__set .chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      chip.classList.toggle('chip--selected');
    });
  });

  // Like button: Default ↔ Liked
  document.querySelectorAll('.like-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var liked = btn.getAttribute('aria-pressed') === 'true';
      btn.setAttribute('aria-pressed', String(!liked));
    });
  });

  // Mobile filter sheet: opened by the filter button, dismissed by the X,
  // Cancel, Apply, the scrim, or Escape.
  (function () {
    var openBtn = document.querySelector('.filter-btn');
    var sheet = document.getElementById('filters');
    var scrim = document.querySelector('.filters-scrim');
    if (!openBtn || !sheet || !scrim) return;

    function setOpen(open) {
      sheet.toggleAttribute('data-open', open);
      scrim.hidden = !open;
      openBtn.setAttribute('aria-expanded', String(open));
      document.body.style.overflow = open ? 'hidden' : '';
    }

    openBtn.addEventListener('click', function () { setOpen(true); });
    scrim.addEventListener('click', function () { setOpen(false); });
    sheet.querySelectorAll('[data-filters-close]').forEach(function (b) {
      b.addEventListener('click', function () { setOpen(false); });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && sheet.hasAttribute('data-open')) setOpen(false);
    });
  })();

</script>
