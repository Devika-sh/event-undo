<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<body>

<!-- ===== Scroll shade: soft fade behind the pinned header ===== -->
<div class="scroll-shade" aria-hidden="true"></div>

<div class="page team-page">

  <!-- ===== Masthead: faint wordmark artwork with the header row and page
             title layered over it ===== -->
  <header class="team-head">
    <picture class="team-head__picture">
      <!-- The phone frame ships its own 428x187 background crop rather than a
           scaled-down desktop lockup. Spaces MUST be percent-encoded here:
           srcset parses whitespace as the URL/descriptor delimiter, so a raw
           space silently discards the source. -->
      <source media="(max-width: 720px)" srcset="Assets/mobile%20bg.png"
              width="428" height="187" />
      <img class="team-head__mark" src="Assets/Detail Masthead.png" alt=""
           width="1280" height="564" />
    </picture>

    <!-- Reserves the pinned bar's own height in flow (desktop) — see .head-bar-spacer -->
    <div class="head-bar-spacer" aria-hidden="true"></div>

    <div class="team-head__bar">
      <a href="index.html" aria-label="eventundo — home">
        <img class="team-head__logo" src="Assets/eventundo-logo.svg" alt="eventundo"
             width="151" height="25" />
      </a>

      <!-- Navbar (Desktop) — active: The Team -->
      <nav class="navbar" aria-label="Primary">
        <a class="navbar__link" href="index.html">Discover</a>
        <a class="navbar__link" href="organizations.html">Organizations</a>
        <a class="navbar__link navbar__link--active" href="team.html" aria-current="page">The Team</a>
        <a class="navbar__link" href="profile.html">Profile</a>
      </nav>
    </div>

    <!-- Phone only. Unlike Discover, where this floats over the masthead, here
         it sits in flow directly above the title, per the frame. -->
    <div class="navbar-wrap">
      <!-- Navbar (Mobile) — gradient wordmark left, menu toggle right -->
      <nav class="navbar-mobile" aria-label="Primary">
        <a class="navbar-mobile__logo" href="index.html">
          <img src="Assets/eventundo-logo.svg" alt="eventundo" width="99" height="16" />
        </a>
        <button class="navbar-btn" type="button" aria-expanded="false"
                aria-controls="mobile-menu" aria-label="Open menu">
          <span class="navbar-btn__icon icon-mask" aria-hidden="true"></span>
        </button>
      </nav>

      <!-- Expanded menu panel. Not part of the Figma component — the mobile navbar
           reference says to build it separately from the desktop nav's section list. -->
      <div class="mobile-menu" id="mobile-menu" hidden>
        <nav class="mobile-menu__links" aria-label="Sections">
          <a class="mobile-menu__link" href="index.html">Discover</a>
          <a class="mobile-menu__link" href="organizations.html">Organizations</a>
          <a class="mobile-menu__link mobile-menu__link--active" href="team.html" aria-current="page">The Team</a>
          <a class="mobile-menu__link" href="profile.html">Profile</a>
        </nav>
        <img class="mobile-menu__mark" src="Assets/Hamburger Logo.png" alt=""
             width="428" height="274" />
      </div>
    </div>

    <h1 class="team-head__title">The Team</h1>
  </header>

  <!-- ===== The team — a row of Profile Cards (User Profile), one per member.
       Skeleton cards only: public-data.js#hydrateTeam replaces this whole block
       with the real `team_members` rows, or with an .eu-empty message when the
       roster is empty. No name, photo or tag is hardcoded here. ===== -->
  <section class="team-grid" aria-label="The team behind eventundo" aria-busy="true">

    <article class="profile-card profile-card--loading" aria-hidden="true">

      <div class="profile-card__photo"><span class="eu-skeleton eu-skeleton--fill"></span></div>

      <div class="profile-card__socials">
        <span class="eu-skeleton" style="width:22px;height:22px;min-width:0"></span>
        <span class="eu-skeleton" style="width:22px;height:22px;min-width:0"></span>
      </div>

      <div class="profile-card__interests">
        <span class="eu-skeleton eu-skeleton--chip" style="width:72px"></span>
        <span class="eu-skeleton eu-skeleton--chip" style="width:60px"></span>
        <span class="eu-skeleton eu-skeleton--chip" style="width:80px"></span>
      </div>
    </article>

    <article class="profile-card profile-card--loading" aria-hidden="true">
      <h2 class="profile-card__name"><span class="eu-skeleton" style="width:min(100%,150px);height:20px"></span></h2>

      <div class="profile-card__photo"><span class="eu-skeleton eu-skeleton--fill"></span></div>

      <div class="profile-card__socials">
        <span class="eu-skeleton" style="width:22px;height:22px;min-width:0"></span>
        <span class="eu-skeleton" style="width:22px;height:22px;min-width:0"></span>
      </div>

      <div class="profile-card__interests">
        <span class="eu-skeleton eu-skeleton--chip" style="width:72px"></span>
        <span class="eu-skeleton eu-skeleton--chip" style="width:60px"></span>
        <span class="eu-skeleton eu-skeleton--chip" style="width:80px"></span>
      </div>
    </article>

    <article class="profile-card profile-card--loading" aria-hidden="true">
      <h2 class="profile-card__name"><span class="eu-skeleton" style="width:min(100%,150px);height:20px"></span></h2>

      <div class="profile-card__photo"><span class="eu-skeleton eu-skeleton--fill"></span></div>

      <div class="profile-card__socials">
        <span class="eu-skeleton" style="width:22px;height:22px;min-width:0"></span>
        <span class="eu-skeleton" style="width:22px;height:22px;min-width:0"></span>
      </div>

      <div class="profile-card__interests">
        <span class="eu-skeleton eu-skeleton--chip" style="width:72px"></span>
        <span class="eu-skeleton eu-skeleton--chip" style="width:60px"></span>
        <span class="eu-skeleton eu-skeleton--chip" style="width:80px"></span>
      </div>
    </article>

    <article class="profile-card profile-card--loading" aria-hidden="true">
      <h2 class="profile-card__name"><span class="eu-skeleton" style="width:min(100%,150px);height:20px"></span></h2>

      <div class="profile-card__photo"><span class="eu-skeleton eu-skeleton--fill"></span></div>

      <div class="profile-card__socials">
        <span class="eu-skeleton" style="width:22px;height:22px;min-width:0"></span>
        <span class="eu-skeleton" style="width:22px;height:22px;min-width:0"></span>
      </div>

      <div class="profile-card__interests">
        <span class="eu-skeleton eu-skeleton--chip" style="width:72px"></span>
        <span class="eu-skeleton eu-skeleton--chip" style="width:60px"></span>
        <span class="eu-skeleton eu-skeleton--chip" style="width:80px"></span>
      </div>

  </section>

  <!-- ===== Footer (Web variant) ===== -->
  <footer class="footer paint-footer-bg">
    <div class="footer__columns">
      <nav class="footer__links" aria-label="Footer left">
        <a class="footer__link" href="index.html">Events</a>

      <div class="footer__social">
        <p class="footer__social-heading">Social Media</p>
        <a class="social-chip" href="#" aria-label="eventundo on Instagram">
          <span class="social-chip__icon icon-mask" aria-hidden="true"></span>
        </a>
      </div>

      <nav class="footer__links footer__links--end" aria-label="Footer right">
        <a class="footer__link" href="team.html">The Team</a>
        <a class="footer__link" href="profile.html">Profile</a>
        <a class="footer__link" href="admin.html">Admin</a>
      </nav>
    </div>

    <p class="footer__mark" aria-hidden="true">eventundo</p>
  </footer>

</div>

<script>
  // Page transition: slide the current page out before following an internal
  // navbar link, so moving between pages reads as one continuous motion
  // instead of a hard cut. Shared verbatim across every page's script.
  (function () {
    var EXIT_MS = 180;
    document.addEventListener('click', function (e) {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var link = e.target.closest('.navbar a[href], .navbar-mobile a[href], .mobile-menu a[href]');
      if (!link) return;
      var href = link.getAttribute('href');
      if (!href || href.charAt(0) === '#' || link.target === '_blank') return;
      e.preventDefault();
      document.body.classList.add('page-exit');
      setTimeout(function () { location.href = href; }, EXIT_MS);
    });
  })();

  // Scroll state: drives the header's scroll-shade gradient. rAF-throttled
  // so it never fights the scroll itself. Shared verbatim across every page.
  (function () {
    var threshold = 80;
    var ticking = false;
    function update() {
      document.body.classList.toggle('is-scrolled', window.scrollY > threshold);
      ticking = false;
    }
    window.addEventListener('scroll', function () {
      if (!ticking) {
        window.requestAnimationFrame(update);
        ticking = true;
      }
    }, { passive: true });
    update();
  })();

  // The interest chips on a roster card are read-only labels rendered by
  // public-data.js#hydrateTeam from each member's own categories — this is a
  // public roster, not a filter. Nothing to bind here.

  // Mobile menu toggle: hamburger <-> x-close
  (function () {
    var toggle = document.querySelector('.navbar-btn');
    var menu = document.getElementById('mobile-menu');
    var wrap = document.querySelector('.navbar-wrap');
    if (!toggle || !menu || !wrap) return;

    function setOpen(open) {
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      menu.hidden = !open;
      // Drops the navbar's pill and lifts it above the overlay.
      wrap.toggleAttribute('data-menu-open', open);
      document.body.style.overflow = open ? 'hidden' : '';
    }

    toggle.addEventListener('click', function () {
      setOpen(toggle.getAttribute('aria-expanded') !== 'true');
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true') setOpen(false);
    });
  })();
</script>

<!-- Live data. Loads events, organisations and the roster from Supabase and
     wires save/RSVP for the signed-in user. Falls back to the static markup
     above when the project isn't configured. -->
