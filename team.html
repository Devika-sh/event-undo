<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Team — eventundo</title>
  <!-- Google Sans Flex — the EventUndo typeface. Variable: opsz 6..144, wght 1..1000 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" />
  <link rel="stylesheet" href="tokens.css" />
  <!-- Shared components: navbar, chip, profile card, edit button, footer, icon-mask. -->
  <link rel="stylesheet" href="styles.css" />
  <!-- This page's own layout. -->
  <link rel="stylesheet" href="team.css" />
</head>
<body>

<!-- ===== Page Loader (splash screen) ===== -->
<div class="page-loader" id="page-loader" aria-hidden="true">
  <span class="page-loader__spinner"></span>
</div>

<!-- ===== Scroll shade: soft fade behind the pinned header ===== -->
<div class="scroll-shade" aria-hidden="true"></div>

<div class="page team-page">

  <!-- ===== Masthead: faint wordmark artwork with the header row and page
             title layered over it ===== -->
  <header class="team-head">
    <picture class="team-head__picture">
      <!-- The phone frame ships its own 428x187 background crop rather than a
           scaled-down desktop lockup. Spaces MUST be percent-encoded here:
           srcset parses whitespace as the URL/descriptor delimiter, so a raw
           space silently discards the source. -->
      <source media="(max-width: 720px)" srcset="Assets/mobile%20bg.png"
              width="428" height="187" />
      <img class="team-head__mark" src="Assets/Detail Masthead.png" alt=""
           width="1280" height="564" />
    </picture>

    <!-- Reserves the pinned bar's own height in flow (desktop) — see .head-bar-spacer -->
    <div class="head-bar-spacer" aria-hidden="true"></div>

    <div class="team-head__bar">
      <a href="index.html" aria-label="eventundo — home">
        <img class="team-head__logo" src="Assets/eventundo-logo.svg" alt="eventundo"
             width="151" height="25" />
      </a>

      <!-- Navbar (Desktop) — active: The Team -->
      <nav class="navbar" aria-label="Primary">
        <a class="navbar__link" href="index.html">Discover</a>
        <a class="navbar__link" href="organizations.html">Organizations</a>
        <a class="navbar__link navbar__link--active" href="team.html" aria-current="page">The Team</a>
        <a class="navbar__link" href="profile.html">Profile</a>
      </nav>
    </div>

    <!-- Phone only. Unlike Discover, where this floats over the masthead, here
         it sits in flow directly above the title, per the frame. -->
    <div class="navbar-wrap">
      <!-- Navbar (Mobile) — gradient wordmark left, menu toggle right -->
      <nav class="navbar-mobile" aria-label="Primary">
        <a class="navbar-mobile__logo" href="index.html">
          <img src="Assets/eventundo-logo.svg" alt="eventundo" width="99" height="16" />
        </a>
        <button class="navbar-btn" type="button" aria-expanded="false"
                aria-controls="mobile-menu" aria-label="Open menu">
          <span class="navbar-btn__icon icon-mask" aria-hidden="true"></span>
        </button>
      </nav>

      <!-- Expanded menu panel. Not part of the Figma component — the mobile navbar
           reference says to build it separately from the desktop nav's section list. -->
      <div class="mobile-menu" id="mobile-menu" hidden>
        <nav class="mobile-menu__links" aria-label="Sections">
          <a class="mobile-menu__link" href="index.html">Discover</a>
          <a class="mobile-menu__link" href="organizations.html">Organizations</a>
          <a class="mobile-menu__link mobile-menu__link--active" href="team.html" aria-current="page">The Team</a>
          <a class="mobile-menu__link" href="profile.html">Profile</a>
        </nav>
        <img class="mobile-menu__mark" src="Assets/Hamburger Logo.png" alt=""
             width="428" height="274" />
      </div>
    </div>

    <h1 class="team-head__title">The Team</h1>
  </header>

  <!-- ===== The team — a row of Profile Cards (User Profile), one per member.
             Names, socials and chips below are placeholder content: swap in the
             real team. ===== -->
  <section class="team-grid" aria-label="The team behind eventundo">

    <!-- Profile Card (User Profile) — name, framed photo, socials, and the
         member's tags as Filter Chips. The component's Edit Button is omitted:
         this is a public roster, not the signed-in user's own profile. -->
    <article class="profile-card">
      <h2 class="profile-card__name">Aparna Nair</h2>

      <!-- Placeholder. The design's photo is stock placeholder content and Figma
           exports it blank, so there is no real asset to pull. Swap in the
           member's own photo: <img src="…" alt="" width="334" height="476" /> -->
      <div class="profile-card__photo profile-card__photo--empty">
        <svg viewBox="0 0 261 300" role="img" aria-label="Profile photo placeholder">
          <circle cx="130" cy="118" r="52" fill="rgba(255,255,255,0.28)" />
          <path d="M34 300c0-53 43-96 96-96s96 43 96 96z" fill="rgba(255,255,255,0.28)" />
        </svg>
      </div>

      <div class="profile-card__socials">
        <a href="#" aria-label="Aparna Nair on Instagram">
          <span class="profile-card__social-icon profile-card__social-icon--instagram icon-mask"></span>
        </a>
        <a href="#" aria-label="Aparna Nair on LinkedIn">
          <span class="profile-card__social-icon profile-card__social-icon--linkedin icon-mask"></span>
        </a>
      </div>

      <!-- Filter Chips; click toggles to On Click (selected). -->
      <div class="profile-card__interests" role="group" aria-label="Aparna Nair's focus areas">
        <button class="chip" type="button">Product</button>
        <button class="chip" type="button">Design</button>
        <button class="chip" type="button">Research</button>
        <button class="chip" type="button">Workshops</button>
        <button class="chip" type="button">Community</button>
      </div>
    </article>

    <article class="profile-card">
      <h2 class="profile-card__name">Rahul Menon</h2>

      <div class="profile-card__photo profile-card__photo--empty">
        <svg viewBox="0 0 261 300" role="img" aria-label="Profile photo placeholder">
          <circle cx="130" cy="118" r="52" fill="rgba(255,255,255,0.28)" />
          <path d="M34 300c0-53 43-96 96-96s96 43 96 96z" fill="rgba(255,255,255,0.28)" />
        </svg>
      </div>

      <div class="profile-card__socials">
        <a href="#" aria-label="Rahul Menon on Instagram">
          <span class="profile-card__social-icon profile-card__social-icon--instagram icon-mask"></span>
        </a>
        <a href="#" aria-label="Rahul Menon on LinkedIn">
          <span class="profile-card__social-icon profile-card__social-icon--linkedin icon-mask"></span>
        </a>
      </div>

      <div class="profile-card__interests" role="group" aria-label="Rahul Menon's focus areas">
        <button class="chip" type="button">Engineering</button>
        <button class="chip" type="button">Frontend</button>
        <button class="chip" type="button">Tech Talks</button>
        <button class="chip" type="button">Hackathons</button>
        <button class="chip" type="button">Startups</button>
      </div>
    </article>

    <article class="profile-card">
      <h2 class="profile-card__name">Sneha Thomas</h2>

      <div class="profile-card__photo profile-card__photo--empty">
        <svg viewBox="0 0 261 300" role="img" aria-label="Profile photo placeholder">
          <circle cx="130" cy="118" r="52" fill="rgba(255,255,255,0.28)" />
          <path d="M34 300c0-53 43-96 96-96s96 43 96 96z" fill="rgba(255,255,255,0.28)" />
        </svg>
      </div>

      <div class="profile-card__socials">
        <a href="#" aria-label="Sneha Thomas on Instagram">
          <span class="profile-card__social-icon profile-card__social-icon--instagram icon-mask"></span>
        </a>
        <a href="#" aria-label="Sneha Thomas on LinkedIn">
          <span class="profile-card__social-icon profile-card__social-icon--linkedin icon-mask"></span>
        </a>
      </div>

      <div class="profile-card__interests" role="group" aria-label="Sneha Thomas's focus areas">
        <button class="chip" type="button">Partnerships</button>
        <button class="chip" type="button">Outreach</button>
        <button class="chip" type="button">Music</button>
        <button class="chip" type="button">Culturals</button>
        <button class="chip" type="button">Media</button>
      </div>
    </article>

  </section>

  <!-- ===== Footer (Web variant) ===== -->
  <footer class="footer paint-footer-bg">
    <div class="footer__columns">
      <nav class="footer__links" aria-label="Footer left">
        <a class="footer__link" href="index.html">Events</a>
        <a class="footer__link" href="organizations.html">Organizations</a>
      </nav>

      <div class="footer__social">
        <p class="footer__social-heading">Social Media</p>
        <a class="social-chip" href="#" aria-label="eventundo on Instagram">
          <span class="social-chip__icon icon-mask" aria-hidden="true"></span>
        </a>
      </div>

      <nav class="footer__links footer__links--end" aria-label="Footer right">
        <a class="footer__link" href="team.html">The Team</a>
        <a class="footer__link" href="profile.html">Profile</a>
      </nav>
    </div>

    <p class="footer__mark" aria-hidden="true">eventundo</p>
  </footer>

</div>

<script>
  // Page Loader: shown at once, hidden once the page (and its images) are
  // ready. A small minimum hold keeps it from just flashing on fast loads.
  (function () {
    var loader = document.getElementById('page-loader');
    if (!loader) return;
    var start = Date.now();
    var MIN_MS = 400;
    function reveal() {
      var wait = Math.max(0, MIN_MS - (Date.now() - start));
      setTimeout(function () { loader.setAttribute('data-hidden', ''); }, wait);
    }
    if (document.readyState === 'complete') reveal();
    else window.addEventListener('load', reveal);
  })();

  // Scroll state: drives the header's scroll-shade gradient. rAF-throttled
  // so it never fights the scroll itself. Shared verbatim across every page.
  (function () {
    var threshold = 80;
    var ticking = false;
    function update() {
      document.body.classList.toggle('is-scrolled', window.scrollY > threshold);
      ticking = false;
    }
    window.addEventListener('scroll', function () {
      if (!ticking) {
        window.requestAnimationFrame(update);
        ticking = true;
      }
    }, { passive: true });
    update();
  })();

  // Filter chips: Default → On Click (selected) → Default
  document.querySelectorAll('.profile-card__interests .chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      chip.classList.toggle('chip--selected');
    });
  });

  // Mobile menu toggle: hamburger <-> x-close
  (function () {
    var toggle = document.querySelector('.navbar-btn');
    var menu = document.getElementById('mobile-menu');
    var wrap = document.querySelector('.navbar-wrap');
    if (!toggle || !menu || !wrap) return;

    function setOpen(open) {
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      menu.hidden = !open;
      // Drops the navbar's pill and lifts it above the overlay.
      wrap.toggleAttribute('data-menu-open', open);
      document.body.style.overflow = open ? 'hidden' : '';
    }

    toggle.addEventListener('click', function () {
      setOpen(toggle.getAttribute('aria-expanded') !== 'true');
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true') setOpen(false);
    });
  })();
</script>

</body>
</html>
