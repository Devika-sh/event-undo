<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Replaced with the real event's name by public-data.js#hydrateEventDetails. -->
  <title>Event — eventundo</title>
  <link rel="icon" type="image/png" href="Assets/eventundo-fallback.png" id="site-favicon" />
  <!-- Google Sans Flex — the EventUndo typeface. Variable: opsz 6..144, wght 1..1000 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" />
  <link rel="stylesheet" href="tokens.css" />
  <!-- Shared components: navbar, chip, card, like button, footer. -->
  <link rel="stylesheet" href="styles.css" />
  <!-- This page's own components. -->
  <link rel="stylesheet" href="event-details.css" />
</head>
<body>

<!-- ===== Scroll shade: soft fade behind the pinned header ===== -->
<div class="scroll-shade" aria-hidden="true"></div>

<div class="page detail-page">

  <!-- ===== Masthead: faint wordmark artwork with the header row + cover banner over it ===== -->
  <header class="detail-head">
    <picture class="detail-head__picture">
      <!-- The phone frame ships its own 428x187 background crop rather than a
           scaled-down desktop lockup. Spaces MUST be percent-encoded here:
           srcset parses whitespace as the URL/descriptor delimiter, so a raw
           space silently discards the source. Same asset the Organizations,
           Team and Profile pages use. -->
      <source media="(max-width: 720px)" srcset="Assets/mobile%20bg.png"
              width="428" height="187" />
      <img class="detail-head__mark" src="Assets/Detail Masthead.png" alt=""
           width="1280" height="564" />
    </picture>

    <!-- Reserves the pinned bar's own height in flow (desktop) — see .head-bar-spacer -->
    <div class="head-bar-spacer" aria-hidden="true"></div>

    <div class="detail-head__bar">
      <a class="detail-head__brand" href="index.html" aria-label="eventundo — home">
        <img class="brand-mark" src="Assets/eventundo-logo.svg" alt="eventundo"
             width="151" height="25" />
      </a>

      <!-- Navbar (Desktop) — active: Discover -->
      <nav class="navbar" aria-label="Primary">
        <a class="navbar__link navbar__link--active" href="index.html" aria-current="page">Discover</a>
        <a class="navbar__link" href="organizations.html">Organizations</a>
        <a class="navbar__link" href="team.html">The Team</a>
        <a class="navbar__link" href="profile.html">Profile</a>
      </nav>

      <!-- Navbar (Mobile) — gradient wordmark left, menu toggle right.
           Reused verbatim from the Discover page's shared styles.css rules. -->
      <nav class="navbar-mobile" aria-label="Primary">
        <a class="navbar-mobile__logo" href="index.html">
          <img src="Assets/eventundo-logo.svg" alt="eventundo" width="99" height="16" />
        </a>
        <button class="navbar-btn" type="button" aria-expanded="false"
                aria-controls="mobile-menu" aria-label="Open menu">
          <span class="navbar-btn__icon icon-mask" aria-hidden="true"></span>
        </button>
      </nav>

      <!-- Expanded menu panel. Not part of the Figma component — built once
           for the Discover page and reused here as-is. -->
      <div class="mobile-menu" id="mobile-menu" hidden>
        <nav class="mobile-menu__links" aria-label="Sections">
          <a class="mobile-menu__link mobile-menu__link--active" href="index.html" aria-current="page">Discover</a>
          <a class="mobile-menu__link" href="organizations.html">Organizations</a>
          <a class="mobile-menu__link" href="team.html">The Team</a>
          <a class="mobile-menu__link" href="profile.html">Profile</a>
        </nav>
        <img class="mobile-menu__mark" src="Assets/Hamburger Logo.png" alt=""
             width="428" height="274" />
      </div>
    </div>

    <!-- Image / `Event Details` variant — 1280x300 cover banner, no scrim overlay.
         Shimmers until public-data.js sets the real banner (or the eventundo
         fallback, for an event with no artwork of its own). -->
    <div class="banner" data-loading>
      <img class="banner__photo" alt="" width="1600" height="900" />
    </div>
  </header>

  <!-- ===== Event heading ===== -->
  <section class="event-head">
    <h1 class="event-head__title"><span class="eu-skeleton" style="width:280px;height:28px"></span></h1>
    <p class="event-head__org"><span class="eu-skeleton" style="width:160px"></span></p>
  </section>

  <!-- ===== Question Card (RSVP) ===== -->
  <section class="question" aria-labelledby="rsvp-question">
    <form class="question__body" onsubmit="return false;">
      <p class="question__title" id="rsvp-question">Are you Attending this Event?</p>

      <!-- Single-choice question: one answer resolves the prompt. -->
      <div class="question__answers" role="radiogroup" aria-labelledby="rsvp-question">
        <label class="checkbox">
          <input class="checkbox__input" type="radio" name="rsvp" value="yes" />
          <span class="checkbox__box">
            <!-- Untitled UI `check` — exported from the Checkbox `Selected`
                 variant in the EU Design System library. -->
            <span class="checkbox__check icon-mask" aria-hidden="true"></span>
          </span>
          <span class="checkbox__label">Yes</span>
        </label>

        <label class="checkbox">
          <input class="checkbox__input" type="radio" name="rsvp" value="no" />
          <span class="checkbox__box">
            <span class="checkbox__check icon-mask" aria-hidden="true"></span>
          </span>
          <span class="checkbox__label">No</span>
        </label>
      </div>

      <!-- Ships disabled; enables once an answer is picked. -->
      <button class="btn-cta" type="submit" disabled>
        Register Now
        <span class="btn-cta__icon icon-mask" aria-hidden="true"></span>
      </button>
    </form>

    <img class="question__mark" src="Assets/eventundo-watermark.svg" alt=""
         width="783" height="132" aria-hidden="true" />
  </section>

  <!-- ===== Event Details rows + About ===== -->
  <section class="detail-body">
    <ul class="meta">
      <li class="meta__row">
        <span class="meta__icon meta__icon--date icon-mask" aria-hidden="true"></span>
        <span class="meta__text"><span class="eu-skeleton" style="width:120px"></span></span>
      </li>
      <li class="meta__row">
        <span class="meta__icon meta__icon--time icon-mask" aria-hidden="true"></span>
        <span class="meta__text"><span class="eu-skeleton" style="width:80px"></span></span>
      </li>
      <li class="meta__row">
        <span class="meta__icon meta__icon--venue icon-mask" aria-hidden="true"></span>
        <span class="meta__text"><span class="eu-skeleton" style="width:140px"></span></span>
      </li>
      <li class="meta__row">
        <span class="meta__icon meta__icon--cost icon-mask" aria-hidden="true"></span>
        <span class="meta__text"><span class="eu-skeleton" style="width:60px"></span></span>
      </li>
    </ul>

    <div class="about">
      <h2 class="about__title">About</h2>
      <div class="about__body">
        <p class="about__text">
          <span class="eu-skeleton" style="width:100%;margin-bottom:8px"></span>
          <span class="eu-skeleton" style="width:100%;margin-bottom:8px"></span>
          <span class="eu-skeleton" style="width:60%"></span>
        </p>
        <div class="about__tags" id="about-tags">
          <span class="eu-skeleton" style="width:72px;height:28px;border-radius:var(--radius-full)"></span>
          <span class="eu-skeleton" style="width:64px;height:28px;border-radius:var(--radius-full)"></span>
          <span class="eu-skeleton" style="width:80px;height:28px;border-radius:var(--radius-full)"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== See Friends Attending =====
       Hidden until real attendee data (with a real profile photo) is
       available for this event — see hydrateEventDetails() / renderFriends()
       in public-data.js. Never shows placeholder avatars. -->
  <section class="friends" id="friends-section" hidden>
    <a class="friends__link" href="#">See Friends Attending</a>
    <ul class="friends__stack" id="friends-stack"></ul>
  </section>

  <!-- ===== More Events =====
       Hidden until public-data.js confirms this organiser actually has other
       published events; it fills the track and the heading, then unhides. -->
  <section class="more-events" aria-labelledby="more-events-title" hidden>
    <h2 class="more-events__title" id="more-events-title">More Events</h2>

    <div class="more-events__viewport">
      <div class="more-events__track" id="more-events-track" tabindex="0"
           role="group" aria-label="More events from this organiser"></div>

      <!-- Chevron Button (Navigation) — Enabled / Disabled -->
      <button class="chev chev--prev" type="button" aria-controls="more-events-track"
              aria-label="Previous events">
        <span class="chev__icon icon-mask" aria-hidden="true"></span>
      </button>
      <button class="chev chev--next" type="button" aria-controls="more-events-track"
              aria-label="Next events">
        <span class="chev__icon icon-mask" aria-hidden="true"></span>
      </button>
    </div>
  </section>

  <!-- ===== Footer (Web variant) ===== -->
  <footer class="footer paint-footer-bg">
    <div class="footer__columns">
      <nav class="footer__links" aria-label="Footer left">
        <a class="footer__link" href="index.html">Events</a>
        <a class="footer__link" href="organizations.html">Organizations</a>
      </nav>

      <div class="footer__social">
        <p class="footer__social-heading">Social Media</p>
        <a class="social-chip" href="#" aria-label="eventundo on Instagram">
          <span class="social-chip__icon icon-mask" aria-hidden="true"></span>
        </a>
      </div>

      <nav class="footer__links footer__links--end" aria-label="Footer right">
        <a class="footer__link" href="team.html">The Team</a>
        <a class="footer__link" href="profile.html">Profile</a>
        <a class="footer__link" href="admin.html">Admin</a>
      </nav>
    </div>

    <p class="footer__mark" aria-hidden="true">eventundo</p>
  </footer>

</div>

<script>
  // Page transition: slide the current page out before following an internal
  // navbar link, so moving between pages reads as one continuous motion
  // instead of a hard cut. Shared verbatim across every page's script.
  (function () {
    var EXIT_MS = 180;
    document.addEventListener('click', function (e) {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var link = e.target.closest('.navbar a[href], .navbar-mobile a[href], .mobile-menu a[href]');
      if (!link) return;
      var href = link.getAttribute('href');
      if (!href || href.charAt(0) === '#' || link.target === '_blank') return;
      e.preventDefault();
      document.body.classList.add('page-exit');
      setTimeout(function () { location.href = href; }, EXIT_MS);
    });
  })();

  // Scroll state: drives the header's scroll-shade gradient. rAF-throttled
  // so it never fights the scroll itself. Shared verbatim across every page.
  (function () {
    var threshold = 80;
    var ticking = false;
    function update() {
      document.body.classList.toggle('is-scrolled', window.scrollY > threshold);
      ticking = false;
    }
    window.addEventListener('scroll', function () {
      if (!ticking) {
        window.requestAnimationFrame(update);
        ticking = true;
      }
    }, { passive: true });
    update();
  })();

  // Like button: Default ↔ Liked
  document.querySelectorAll('.like-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var liked = btn.getAttribute('aria-pressed') === 'true';
      btn.setAttribute('aria-pressed', String(!liked));
    });
  });

  // RSVP: the CTA is disabled until Yes or No is picked.
  (function () {
    var cta = document.querySelector('.btn-cta');
    document.querySelectorAll('input[name="rsvp"]').forEach(function (input) {
      input.addEventListener('change', function () { cta.disabled = false; });
    });
  })();

  // More Events carousel: page by one card, and switch the chevrons to their
  // Disabled variant at each end of the track.
  (function () {
    var track = document.getElementById('more-events-track');
    var prev = document.querySelector('.chev--prev');
    var next = document.querySelector('.chev--next');
    if (!track) return;

    function step() {
      var card = track.querySelector('.card');
      if (!card) return track.clientWidth;
      // One card plus the row gap.
      return card.getBoundingClientRect().width + parseFloat(getComputedStyle(track).columnGap || 0);
    }

    // Chevrons switch to their Disabled variant at each end of the track.
    function setFlags(pos) {
      var max = track.scrollWidth - track.clientWidth;
      prev.disabled = pos <= 1;
      next.disabled = pos >= max - 1;
    }

    // Paged off the destination rather than off a scroll event, so the buttons
    // are right the moment they're pressed instead of a frame later.
    // No `behavior` option: the track's own scroll-behavior decides, so the
    // reduced-motion override in CSS is respected.
    function page(direction) {
      var max = track.scrollWidth - track.clientWidth;
      var target = Math.max(0, Math.min(max, track.scrollLeft + direction * step()));
      track.scrollTo({ left: target });
      setFlags(target);
    }

    prev.addEventListener('click', function () { page(-1); });
    next.addEventListener('click', function () { page(1); });
    // Keeps the chevrons honest for wheel / touch / keyboard scrolling too.
    track.addEventListener('scroll', function () { setFlags(track.scrollLeft); });
    window.addEventListener('resize', function () { setFlags(track.scrollLeft); });
    setFlags(0);
  })();

  // Mobile menu: hamburger ↔ x-close, same behaviour as the other pages.
  (function () {
    var toggle = document.querySelector('.navbar-btn');
    var menu = document.getElementById('mobile-menu');
    var bar = document.querySelector('.detail-head__bar');
    if (!toggle || !menu || !bar) return;

    function setOpen(open) {
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      menu.hidden = !open;
      // Drops the navbar's pill and lifts it above the overlay.
      bar.toggleAttribute('data-menu-open', open);
      document.body.style.overflow = open ? 'hidden' : '';
    }

    toggle.addEventListener('click', function () {
      setOpen(toggle.getAttribute('aria-expanded') !== 'true');
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true') setOpen(false);
    });
  })();
</script>

<!-- Live data. Loads events, organisations and the roster from Supabase and
     wires save/RSVP for the signed-in user. Falls back to the static markup
     above when the project isn't configured. -->
<script type="module" src="public-data.js"></script>

</body>
</html>
